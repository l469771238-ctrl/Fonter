name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FontAnalyzerAndroid_Project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: |
          unzip -o FontAnalyzerAndroid_Project.zip -d .
          test -f FontAnalyzerAndroid/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd FontAnalyzerAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FontAnalyzer-debug-apk
          path: FontAnalyzerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
